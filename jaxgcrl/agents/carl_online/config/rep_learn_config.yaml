dataset:
  # goal-conditioned datasets auto-download.
  source: ogbench
  name: antmaze-medium-navigate-v0
  dir: /scratch/cluster/idutta/ogbench_datasets
  compact_dataset: false
  download_first: true

gc_sampling:
  # Goal sampling strategy matching OGBench's GCDataset.
  discount: 0.99          # Used by geometric sampling: offset ~ Geom(1 - discount).
  geom_sample: true       # true = geometric lookahead; false = uniform lookahead.
  p_trajgoal: 0.9         # Probability of sampling a future state from the same trajectory.
  p_randomgoal: 0.1       # Probability of sampling a random state as the goal.
  # Slice goal observations to these indices before passing to GoalRep.
  # Set to match env.goal_indices so the checkpoint is compatible with SAC/HER.
  # For ant/antmaze: xy position is at indices 0 and 1.
  # Set to null to use full observations as goals (legacy behaviour).
  goal_indices: [0, 1]

rep_learn:
  seed: 0
  use_goal_rep: true
  rep_dim: 512
  hidden_sizes: [256, 256]
  # Must match SAC's nce_k_step so ActionsEncoder input dims are compatible.
  nce_k_step: 25
  batch_size: 1024
  val_num_batches: 8
  eval_interval: 100
  epochs: 100000
  learning_rate: 0.0003
  temperature: 0.1

  # InfoNCE norm settings (same form as in SAC).
  nce_min_norm: 0.000001
  nce_norm_ord: 2
  nce_norm_axis: -1
  nce_norm_keepdims: true

  # Training/logging/checkpoint behavior.
  init_best_loss: inf
  checkpoint_prefix: rep_params_
  checkpoint_overwrite: true

wandb:
  project: jaxgcrl-rep-learn
  mode: online

logging:
  wandb_loss_key: train/loss
  wandb_val_loss_key: val/loss
  start_message: Starting offline representation training...
  step_message_template: "Step {step} | Train Loss: {loss:.4f} | Val Loss: {val_loss}"
