[project]
name = "jaxgcrl"
version = "0.2.8"
description = "Blazingly fast goal-conditioned environments based on MJX and BRAX."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "pip>=25.0.1",
  "jax==0.4.25",
  "flax>=0.8,<0.9",
  "brax==0.12.1",
  "matplotlib>=3.8,<3.11",
  "mujoco==3.2.7",
  "mujoco-mjx==3.2.7",
  "distrax>=0.1.5,<0.2",
  "numpy>=1.26,<2",
  "scipy>=1.12,<1.13",
  "tyro==0.9.16",
  "wandb>=0.16,<0.27",
  "wandb-osh>=1.2,<2",
]

[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]==0.4.25; platform_system == 'Linux'",
]
cuda13 = [
  "jax[cuda13]==0.4.25; platform_system == 'Linux'",
]

[project.scripts]
jaxgcrl = "run:cli"

[project.urls]
homepage = "https://michalbortkiewicz.github.io/JaxGCRL/"

[build-system]
requires = [ "setuptools", "wheel" ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = {} }
include-package-data = true
py-modules = [ "run" ]

[tool.setuptools.package-data]
"jaxgcrl.envs" = ["**/assets/*"]

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
